const pending=()=>`<div class="pending"><a href="#service/games"><h3>Game art</h3><p>Space reserved for your game scenes and asset sets ↗</p></a><a href="#service/illustration"><h3>Illustration</h3><p>Space reserved for your illustration series ↗</p></a></div>`;
const explorer=()=>`<section class="work-area shell" id="selected"><div class="section-head"><h2>Project index.</h2><p>Explore the work.<br>Hover or focus a title to preview.</p></div><div class="work-explorer"><div class="work-rows">${projects.map((p,i)=>`<a class="work-row ${i===0?'active':''}" href="${projectLink(p)}" data-preview="${p.id}"><span class="number">${String(i+1).padStart(2,'0')}</span><h3>${esc(p.title)}</h3><span class="row-arrow" aria-hidden="true">↗</span></a>`).join('')}<p class="project-total">10 projects / 39 views</p></div><div class="work-preview"><a class="preview-visual" href="${projectLink(projects[0])}" data-cursor="Open project">${image(projects[0].image,projects[0].title)}</a><div class="preview-description"><b>${projects[0].title}</b><span>${projects[0].category}</span></div></div></div>${pending()}</section>`;
const browser=(src,alt,hero=false)=>`<div class="browser"><div class="browser-inner"><div class="browser-bar" aria-hidden="true"><i></i><i></i><i></i><span>QuickGrade</span></div>${image(src,alt,{hero,sizes:'90vw'})}</div></div>`;
let cleanup=()=>{},currentRoute='',generation=0;
function render(){cleanup();generation++;const token=generation;const [rawRoute,id]=location.hash.slice(1).split('/');const route=!rawRoute||rawRoute==='top'?'home':rawRoute;currentRoute=route;document.body.dataset.route=route;$('.cursor').classList.remove('visible');document.querySelectorAll('.nav nav a').forEach(a=>a.setAttribute('aria-current',a.hash==='#'+route||(route==='project'&&a.hash==='#work')||(route==='service'&&a.hash==='#services')?'page':'false'));
 const main=$('#main');
 if(route==='home')main.innerHTML=`<section class="hero shell" id="home"><div class="hero-glow"></div><div class="hero-head"><span class="eyebrow">Independent design studio</span><p>Branding, books, print,<br>game art & illustration.</p></div><h1>Amaanity.</h1><div class="hero-collage"><a href="#project/brand-01" class="hero-piece piece-one" data-depth="18" data-cursor="View project">${image(projects[0].image,'WestVue brand identity',{hero:true,sizes:'(max-width:700px) 43vw, 32vw'})}<span class="piece-label">WestVue / Identity</span></a><a href="#project/lead-01" class="hero-piece piece-two" data-depth="-13" data-cursor="View project">${image(projects[1].image,'Creating Talents educational publishing',{hero:true,sizes:'(max-width:700px) 48vw, 33vw'})}<span class="piece-label">Creating Talents / Publishing</span></a><a href="#project/pack-01" class="hero-piece piece-three" data-depth="25" data-cursor="View project">${image(projects[2].image,'FAR Organics product packaging',{hero:true,sizes:'(max-width:700px) 44vw, 27vw'})}<span class="piece-label">FAR Organics / Packaging</span></a></div><div class="hero-foot"><p>A team of designers.<br>Amaan leads the work.</p><button class="scroll-link" type="button" data-scroll="featured">Selected work <span class="circle-arrow" aria-hidden="true">↓</span></button></div></section><div class="marquee" aria-label="Brand identity, books, print, game art and illustration"><div class="marquee-track" aria-hidden="true">${Array(2).fill('Brand identity <span>↗</span> Books & education <span>↗</span> Print design <span>↗</span> Game art <span>↗</span> Illustration <span>↗</span>').join(' ')}</div></div><section class="intro shell" id="featured"><span class="eyebrow">Selected work / 01—02</span><div><h2>Selected work.</h2><p>From the first brief to the final files, we design the work and coordinate its delivery.</p></div></section><div class="spotlights shell">${spotlight(projects[0])}${spotlight(projects[1])}</div>${explorer()}<section class="studio-teaser"><div class="shell"><div><span class="eyebrow">The studio</span><h2>Amaan.<br>And the team.</h2></div><div><p>Designers working across identity, publishing, print and game art. Amaan leads the brief, creative direction and delivery.</p>${roll('#studio','Meet the studio')}</div></div></section><section class="service-list shell"><p class="eyebrow">What we do</p>${serviceRows()}</section>${footer()}`;
 else if(route==='work')main.innerHTML=`<div class="work-view" id="work"><section class="page-heading shell"><span class="eyebrow">Our work</span><h1>Work.</h1><p>Hover a name. Open a project.</p></section>${explorer()}</div>${footer()}`;
 else if(route==='services')main.innerHTML=`<section class="page-heading shell"><span class="eyebrow" id="services">Our services</span><h1>What we design.</h1><p>Five areas of design, with a team assigned around the needs of each project.</p></section><section class="service-list shell" style="padding-top:0">${serviceRows()}</section>${footer()}`;
 else if(route==='service'){const s=services.find(s=>s.id===id);if(!s){main.innerHTML='<section class="notfound shell"><h1>Service not found.</h1><a href="#services">All services ↗</a></section>'}else{main.innerHTML=`<section class="page-heading shell"><a class="back-link" href="#services">← All services</a><div class="eyebrow">Amaanity / ${s.title}</div><h1>${s.title}.</h1><p>${s.intro}</p></section><section class="service-detail shell"><h2>What your project<br>can include.</h2><ul class="deliverables">${s.items.map(x=>`<li>${x}</li>`).join('')}</ul></section><section class="service-projects shell"><span class="eyebrow">Relevant projects</span>${s.projects.length?`<div class="spotlights">${s.projects.map(id=>spotlight(projects.find(p=>p.id===id))).join('')}</div>`:`<div class="reservation-stage">${s.id==='games'?'Game scene + asset collection':'Illustration series'} / Space reserved for your files</div>`}</section>${footer()}`;}}
 else if(route==='studio')main.innerHTML=`<section class="page-heading shell"><span class="eyebrow" id="studio">About Amaanity</span><h1>The studio.</h1><p>An independent design team led by Muhammad Amaan.</p></section><section class="studio-page shell"><div class="founder-portrait">${image('/portfolio/assets/amaan-avatar-original.webp','Amaan, founder and creative lead')}</div><div><h2>One point of contact.<br>A team behind the work.</h2><p>Amaan leads client communication, creative direction and project delivery. Our designers contribute across the work, with responsibilities defined around each brief.</p><p>Our experience includes ongoing educational publishing, brand identity and print projects. Our game artists bring experience from mobile-game studios.</p><a class="roll-link" href="https://amaanity.com/assets/resumes/Amaans-Resume.pdf?v=20261115" download="Amaan's Resume.pdf">Amaan’s Resume ↗</a></div></section><section class="process shell">${[['Brief','Clarify the audience, deliverables and timing.'],['Direction','Agree on the approach before building the complete set.'],['Design & review','Create the work and coordinate feedback.'],['Handoff','Review the deliverables and prepare the final files.']].map(([title,text],i)=>`<article><span class="eyebrow">0${i+1}</span><h3>${title}</h3><p>${text}</p></article>`).join('')}</section>${footer()}`;
 else if(route==='contact')main.innerHTML=`<section class="page-heading shell"><span class="eyebrow" id="contact">Start a project</span><h1>Let’s talk.</h1><p>Share what you need, who it is for and when you need it. A rough brief is a useful place to start.</p></section><div class="shell"><a class="contact-email" href="mailto:amaan@amaanity.com?subject=Project%20enquiry">amaan@amaanity.com ↗</a><section class="contact-detail"><div><h2>A useful starting point.</h2><ul class="brief-list"><li>The project <span>What you need designed</span></li><li>The audience <span>Who it needs to reach</span></li><li>The scope <span>Formats, pages or assets</span></li><li>The timing <span>Deadline and milestones</span></li><li>The budget <span>A range, if you have one</span></li></ul></div><div><h2>What happens next?</h2><p>We review the brief, clarify any open questions and discuss the scope before agreeing on the work.</p><div style="margin-top:25px"><button class="roll-link copy-email" type="button">Copy email ↗</button><span class="copy-status" role="status"></span></div></div></section></div>${footer()}`;
 else if(route==='project'){const p=projects.find(p=>p.id===id);if(!p){main.innerHTML='<section class="notfound shell"><h1>Project not found.</h1><a href="#work">All work ↗</a></section>'}else{const next=projects[(projects.indexOf(p)+1)%projects.length];main.innerHTML=`<article class="shell"><header class="case-heading" style="position:static;background:none;backdrop-filter:none"><a class="back-link" href="#work">← All projects</a><div class="eyebrow">${esc(p.category)}</div><h1>${esc(p.title)}</h1><div class="case-lead"><p>${esc(p.note)}</p><p class="case-role">${esc(p.role)}</p></div></header><button type="button" class="case-hero" data-open="0" data-id="${p.id}" data-cursor="Enlarge">${p.id==='digital-01'?browser(p.gallery[0].src,p.gallery[0].label,true):image(p.gallery[0].src,p.gallery[0].label,{hero:true,sizes:'90vw'})}</button><section class="case-copy"><div><h2>The brief.</h2><p>${esc(p.brief)}</p></div><div><h2>The work.</h2><p>${esc(p.delivery)}</p></div></section><div class="case-gallery">${p.gallery.slice(1).map((g,i)=>`<figure><button class="case-image" type="button" data-open="${i+1}" data-id="${p.id}" data-cursor="Enlarge" aria-label="Enlarge ${esc(g.label)}">${p.id==='digital-01'?browser(g.src,g.label):image(g.src,g.label,{sizes:'(max-width:700px) 90vw, 65vw'})}</button><figcaption>${esc(g.label)}</figcaption></figure>`).join('')}</div><p class="presentation-note">${p.id==='digital-01'?'Interface designs from the shared Figma file, shown in browser mockups. This is a design presentation, not a live product demo.':'Presentation scenes include conceptual and AI-assisted mockups of existing artwork. These scenes do not document manufactured products or installed spaces.'}</p><a class="next-case" href="${projectLink(next)}"><div><span class="eyebrow">Next project</span><h2>${esc(next.title)}</h2></div><span aria-hidden="true">↗</span></a></article>${footer()}`;}}
 else main.innerHTML='<section class="notfound shell"><h1>Page not found.</h1><a href="#home">Home ↗</a></section>';
 document.title=(route==='project'?projects.find(p=>p.id===id)?.title||'Project':route==='home'?'Independent design studio':route==='service'?services.find(s=>s.id===id)?.title||'Services':route[0].toUpperCase()+route.slice(1))+' — Amaanity';
 window.scrollTo({top:0,behavior:'instant'});bindInteractions(token);
}
function enter(el,delay=0){if(!motion||!el)return;el.animate([{opacity:0,transform:'translateY(28px)'},{opacity:1,transform:'translateY(0)'}],{duration:700,delay,easing:'cubic-bezier(.2,.7,.2,1)',fill:'backwards'})}
function bindInteractions(token){let timers=[],listeners=[];const on=(el,event,fn,opts)=>{el.addEventListener(event,fn,opts);listeners.push(()=>el.removeEventListener(event,fn,opts))};
 const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){enter(e.target);observer.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll('.intro,.spotlight,.section-head,.studio-teaser .shell,.service-row,.case-copy,.case-gallery figure,.process article').forEach(el=>observer.observe(el));
 document.querySelectorAll('.page-heading h1,.case-heading h1,.hero h1').forEach(el=>enter(el,60));document.querySelectorAll('.hero-piece').forEach((el,i)=>enter(el,180+i*100));
 document.querySelectorAll('[data-scroll]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.scroll)?.scrollIntoView({behavior:motion?'smooth':'instant'}));
 const hero=$('.hero');if(hero){on(hero,'pointermove',e=>{if(!motion||!fine.matches)return;const r=hero.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;hero.querySelectorAll('[data-depth]').forEach(el=>{el.style.setProperty('--mx',x*Number(el.dataset.depth)+'px');el.style.setProperty('--my',y*Number(el.dataset.depth)+'px')});hero.querySelector('.hero-glow').style.setProperty('--px',x*100+'px');hero.querySelector('.hero-glow').style.setProperty('--py',y*70+'px')});on(hero,'pointerleave',()=>hero.querySelectorAll('[data-depth]').forEach(el=>{el.style.setProperty('--mx','0px');el.style.setProperty('--my','0px')}));}
 const preview=$('.preview-visual');if(preview){let hoverTimer=null,previewToken=0;const clear=()=>{clearInterval(hoverTimer);hoverTimer=null;previewToken++};const show=async(p,index=0)=>{const t=++previewToken;const src=p.gallery[index].src;const stage=document.createElement('div');stage.innerHTML=image(src,p.title+' — '+p.gallery[index].label,{hero:true,sizes:'(max-width:700px) 90vw, 44vw'});const img=stage.firstElementChild;try{await img.decode()}catch{return}if(t!==previewToken||token!==generation)return;preview.replaceChildren(img);preview.href=projectLink(p);$('.preview-description b').textContent=p.title;$('.preview-description span').textContent=p.category;if(motion)img.animate([{opacity:0,transform:'scale(1.03)'},{opacity:1,transform:'scale(1)'}],{duration:450,easing:'ease-out'})};document.querySelectorAll('[data-preview]').forEach(row=>{const p=projects.find(p=>p.id===row.dataset.preview);const choose=e=>{clear();document.querySelectorAll('[data-preview]').forEach(r=>r.classList.toggle('active',r===row));show(p);if(motion&&fine.matches&&e.type==='pointerenter'){let i=0;hoverTimer=setInterval(()=>{if(!motion){clear();return}if(!document.hidden&&!viewer.open)show(p,++i%p.gallery.length)},2200)}};on(row,'pointerenter',choose);on(row,'focus',choose);on(row,'pointerleave',clear);on(row,'blur',clear)});on(document,'visibilitychange',()=>{if(document.hidden)clear()});listeners.push(clear);}
 document.querySelectorAll('[data-open]').forEach(button=>button.onclick=()=>openImage(button));
 const copy=$('.copy-email');if(copy)copy.onclick=async()=>{try{await navigator.clipboard.writeText('amaan@amaanity.com');$('.copy-status').textContent='Email copied.'}catch{$('.copy-status').textContent='amaan@amaanity.com'}};
 const motionToggle=$('.motion-toggle');if(motionToggle){motionToggle.disabled=reduced.matches;motionToggle.title=reduced.matches?'Following your device’s reduced-motion setting':'Toggle animation';motionToggle.onclick=()=>{motionPreference=!motionPreference;motion=motionPreference&&!reduced.matches;document.body.classList.toggle('motion-off',!motion);motionToggle.textContent=motion?'Motion on':'Motion off';motionToggle.setAttribute('aria-pressed',String(motion));if(!motion){document.getAnimations().forEach(a=>a.cancel());$('.cursor').classList.remove('visible')}try{localStorage.setItem('amaanity-interactive-motion',motion?'on':'off')}catch{}};}
 cleanup=()=>{observer.disconnect();listeners.forEach(fn=>fn());timers.forEach(clearTimeout)};
}
const menu=$('.menu-dialog'),viewer=$('.viewer');$('.menu-trigger').onclick=()=>{menu.showModal();if(motion){menu.animate([{opacity:.1},{opacity:1}],{duration:300,easing:'ease-out'});menu.querySelectorAll('.menu-links a').forEach((el,i)=>el.animate([{opacity:0},{opacity:1}],{duration:400,delay:70+i*45,fill:'backwards'}))}};$('.menu-close').onclick=()=>menu.close();menu.addEventListener('close',()=>$('.menu-trigger').focus());menu.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const next=a.getAttribute('href');menu.close();if(location.hash===next)render();else location.hash=next}));
let viewedProject=null,viewedIndex=0,opener=null;function showImage(i){viewedIndex=(i+viewedProject.gallery.length)%viewedProject.gallery.length;const g=viewedProject.gallery[viewedIndex];$('.viewer-stage img').src=url(g.src);$('.viewer-stage img').alt=viewedProject.title+' — '+g.label;$('.viewer-title').textContent=viewedProject.title;$('.viewer-caption').textContent=String(viewedIndex+1).padStart(2,'0')+' / '+String(viewedProject.gallery.length).padStart(2,'0')+' · '+g.label}
function openImage(button){opener=button;viewedProject=projects.find(p=>p.id===button.dataset.id);showImage(Number(button.dataset.open));viewer.showModal();$('.cursor').classList.remove('visible');enter($('.viewer-stage'))}$('.viewer-close').onclick=()=>viewer.close();$('.viewer-prev').onclick=()=>showImage(viewedIndex-1);$('.viewer-next').onclick=()=>showImage(viewedIndex+1);viewer.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();showImage(viewedIndex+1)}if(e.key==='ArrowLeft'){e.preventDefault();showImage(viewedIndex-1)}});viewer.addEventListener('close',()=>opener?.focus());
let scrollFrame=0;function scrollEffects(){scrollFrame=0;const total=document.documentElement.scrollHeight-innerHeight;$('.progress').style.width=(total>0?scrollY/total*100:0)+'%';if(!motion||!fine.matches)return;document.querySelectorAll('.drift').forEach(el=>{const r=el.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight){const img=el.querySelector('img');img.style.translate='0 '+Math.max(-18,Math.min(18,(r.top-innerHeight*.4)*.035))+'px'}})}window.addEventListener('scroll',()=>{if(!scrollFrame)scrollFrame=requestAnimationFrame(scrollEffects)},{passive:true});
const cursor=$('.cursor');document.addEventListener('pointermove',e=>{const target=e.target.closest('[data-cursor]');if(!motion||!fine.matches||viewer.open||menu.open||!target){cursor.classList.remove('visible');return}cursor.textContent=target.dataset.cursor+' ↗';cursor.classList.add('visible');cursor.style.transform=`translate(${e.clientX-37}px,${e.clientY-37}px) scale(1)`});document.addEventListener('pointerout',e=>{if(!e.relatedTarget)cursor.classList.remove('visible')});
function navigate(){if(viewer.open)viewer.close();if(menu.open)menu.close();render();if(motion)$('#main').animate([{opacity:.2,transform:'translateY(14px)'},{opacity:1,transform:'translateY(0)'}],{duration:420,easing:'cubic-bezier(.2,.7,.2,1)'})}
window.addEventListener('hashchange',navigate);reduced.addEventListener('change',()=>{motion=motionPreference&&!reduced.matches;document.body.classList.toggle('motion-off',!motion);if(!motion)document.getAnimations().forEach(a=>a.cancel());const b=$('.motion-toggle');if(b){b.disabled=reduced.matches;b.textContent=motion?'Motion on':'Motion off';b.setAttribute('aria-pressed',String(motion))}});render();
</script></body></html>
